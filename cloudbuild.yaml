steps:
  # Step 1: Build the optimized Next.js standalone container
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/chorecraft:$COMMIT_SHA', '-t', 'gcr.io/$PROJECT_ID/chorecraft:latest', '.']

  # Step 2: Push container image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/chorecraft:latest']

  # Step 3: Deploy the image to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'chorecraft'
      - '--image'
      - 'gcr.io/$PROJECT_ID/chorecraft:latest'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'

images:
  - 'gcr.io/$PROJECT_ID/chorecraft:latest'
  - 'gcr.io/$PROJECT_ID/chorecraft:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY

