<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="fjordSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="35%" stop-color="#4338CA" />
      <stop offset="65%" stop-color="#0755B5" />
      <stop offset="85%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#FB923C" />
    </linearGradient>
    <linearGradient id="cliffLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="cliffRight" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="25%" stop-color="#E11D48" />
      <stop offset="60%" stop-color="#0755B5" />
      <stop offset="100%" stop-color="#091E42" />
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect x="0" y="0" width="600" height="380" fill="url(#fjordSky)" />

  <!-- Crescent Moon / Setting Sun -->
  <circle cx="300" cy="240" r="45" fill="#FED7AA" opacity="0.9" />

  <!-- Towering Fjord Cliffs (Left) -->
  <polygon points="0,0 160,0 220,180 180,380 0,380" fill="url(#cliffLeft)" />
  <polygon points="160,0 220,180 200,280 120,380" fill="#334155" opacity="0.4" />

  <!-- Towering Fjord Cliffs (Right) -->
  <polygon points="600,0 440,0 380,160 410,380 600,380" fill="url(#cliffRight)" />
  <polygon points="440,0 380,160 400,260 480,380" fill="#334155" opacity="0.4" />

  <!-- Deep Fjord Waters -->
  <rect x="0" y="380" width="600" height="220" fill="url(#waterGrad)" />

  <!-- Sunset Light Beam Across Channel -->
  <polygon points="280,380 320,380 360,600 240,600" fill="#FDE047" opacity="0.35" />

  <!-- Water Reflections -->
  <line x1="220" y1="410" x2="380" y2="410" stroke="#FFEDD5" stroke-width="2" opacity="0.7" stroke-dasharray="10 5" />
  <line x1="180" y1="450" x2="420" y2="450" stroke="#FDBA74" stroke-width="2" opacity="0.5" stroke-dasharray="14 8" />
  <line x1="140" y1="510" x2="460" y2="510" stroke="#60A5FA" stroke-width="1.5" opacity="0.4" stroke-dasharray="16 10" />

  <!-- Minimalist Lighthouse on Right Crag -->
  <rect x="375" y="140" width="8" height="22" fill="#FFFFFF" />
  <polygon points="373,140 379,132 385,140" fill="#EF4444" />
  <circle cx="379" cy="144" r="3" fill="#FEF08A" />
  <!-- Lighthouse Beacon Beam -->
  <polygon points="379,144 0,110 0,160" fill="#FEF08A" opacity="0.25" />

  <!-- Typography Overlay -->
  <rect x="110" y="555" width="380" height="32" rx="16" fill="#0F172A" opacity="0.8" />
  <text x="300" y="576" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" fill="#F4F2E8" letter-spacing="2.5">
    GOLDEN FJORD • CLARITY IS ELIMINATION
  </text>
</svg>

